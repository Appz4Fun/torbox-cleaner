name: Release Python source

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag belongs to main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYTHON'
          import os, re, tomllib
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Expected vMAJOR.MINOR.PATCH'
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert tag == f'v{version}', 'Tag must match package version'
          PYTHON
      - name: Package application source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          git archive --format=tar.gz \
            --prefix="torbox-cleaner-${RELEASE_TAG}/" \
            --output="release/torbox-cleaner-${RELEASE_TAG}-source.tar.gz" \
            HEAD src/torbox_cleaner pyproject.toml uv.lock README.md LICENSE .env.example
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "torbox-cleaner $RELEASE_TAG" \
            --generate-notes release/*
